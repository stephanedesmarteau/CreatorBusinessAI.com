name: Beta tests

on:
  push:
    branches:
      - beta/stabilisation-securite
  pull_request:
    branches:
      - main
      - beta/stabilisation-securite

permissions:
  contents: read

concurrency:
  group: beta-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  tests:
    name: Unit tests and TypeScript
    # Les PR vers main ne concernent ce workflow que si elles viennent de la bêta.
    if: >-
      github.event_name != 'pull_request' ||
      github.head_ref == 'beta/stabilisation-securite' ||
      github.base_ref == 'beta/stabilisation-securite'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate Prisma Client without a database connection
        run: npx --no-install prisma generate

      - name: Generate Next.js types without a production build
        run: npx --no-install next typegen

      - name: Run unit tests
        run: npm test

      - name: Check TypeScript
        run: npm run typecheck
